# 订阅的 Reddit 版块（AI / Agent 方向）
reddit_subreddits:
  - LocalLLaMA
  - ClaudeAI
  - singularity
  - LLMDevs
# 榜单类型：hot（最热门，默认）/ new（最新）/ top
reddit_listing: hot

# HN 首页帖子热度门槛：低于该赞数的帖子跳过（不推送也不记为已读，
# 后续热度涨过门槛仍会推送）；设为 0 关闭
hn_min_points: 50

# GitHub Trending 订阅（无官方 API，解析 trending 页面；删除本块即停用）。
# since: daily/weekly/monthly；languages 留空 = 只订总榜，填语言则每语言一个源。
# limit 控制单次推送条数；不去重——仓库连续多日上榜会如实重复推送。
github_trending:
  since: daily
  languages: []
  limit: 10
  # languages: [python, rust]

# Hugging Face 模型雷达：趋势榜（trendingScore），每天随趋势 workflow 推送。
# filter 为 HF 的模型过滤标签；删除本块即停用。
hf_radar:
  filter: text-generation
  limit: 10

# Hugging Face Daily Papers 论文日报：按赞数取前 N，每天随趋势 workflow 推送。
# 摘要较长，卡片上由 AI 提炼要点；删除本块即停用。
hf_papers:
  limit: 10

# 通用 RSS/Atom 订阅（RSS_SOURCES 需包含 rss，reddit.yml 已是 reddit,hn,rss）。
# filter_topic：可选项，配置后该源先经 AI 相关性过滤，命中主题才推送（如 arXiv）。
# 通用资讯类备选（按需取消注释）：
#   Google News 关键词：https://news.google.com/rss/search?q=LLM&hl=zh-CN&gl=CN&ceid=CN:zh-Hans
#   YouTube 频道：https://www.youtube.com/feeds/videos.xml?channel_id=UC...
#   V2EX 全站：https://www.v2ex.com/index.xml（日均数百条，慎开）
#   36kr：官方 feed 已停更（返回 HTML 页面），需要时走 RSSHub 桥接
#   Anthropic 官方无 RSS（404），可用 Google News 关键词兜底。
generic_feeds:
  # -- 论文 --
  - name: arxiv-cs-cl
    url: https://export.arxiv.org/rss/cs.CL
    filter_topic: "大语言模型（LLM）、Agent/智能体、RAG、模型推理与本地部署、多模态应用方向的研究"
  # -- AI 官方博客 / 领域博客 --
  - name: hf-blog
    url: https://huggingface.co/blog/feed.xml
  - name: openai
    url: https://openai.com/news/rss.xml
  - name: deepmind
    url: https://deepmind.google/blog/rss.xml
  - name: simonwillison
    url: https://simonwillison.net/atom/everything/
  # -- 中文 --
  - name: ruanyifeng
    url: https://www.ruanyifeng.com/blog/atom.xml
  - name: sspai
    url: https://sspai.com/feed
  - name: ithome
    url: https://www.ithome.com/rss/
  - name: solidot
    url: https://www.solidot.org/index.rss
  # -- GitHub Releases --
  - name: gh-vllm
    url: https://github.com/vllm-project/vllm/releases.atom
  - name: gh-transformers
    url: https://github.com/huggingface/transformers/releases.atom

push:
  # 单张卡片最多展示条数，超出部分折叠为"+N"
  max_items_per_card: 10

# 展示时间用的时区偏移小时数（8 = 北京时间）
timezone_offset_hours: 8

# 沿用 G:\project\template 的部署链路：
# GitHub Actions 构建唯一 SHA 镜像 -> 双推 GHCR + 阿里云 ACR
# -> 服务器上的 Self-hosted Runner（label: aliyun）拉取该镜像并 compose 启动。
#
# 复用组织级配置：vars.ALIYUN_ACR_REGISTRY / vars.ALIYUN_ACR_USERNAME、
#                secrets.ALIYUN_ACR_PASSWORD（可选 vars.ALIYUN_ACR_IMAGE_NAME）
# 本仓库 Secrets：FEISHU_WEBHOOK / FEISHU_SECRET(可选) / AI_*(可选) / REDDIT_PROXY(可选)

name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository }}
  ALIYUN_ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
  ALIYUN_ACR_USERNAME: ${{ vars.ALIYUN_ACR_USERNAME }}
  ALIYUN_ACR_IMAGE_NAME: ${{ vars.ALIYUN_ACR_IMAGE_NAME || format('wangshun_build/{0}', github.event.repository.name) }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate build configuration
        shell: bash
        env:
          ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          [[ -n "$ALIYUN_ACR_REGISTRY" ]] || missing+=(ALIYUN_ACR_REGISTRY)
          [[ -n "$ALIYUN_ACR_USERNAME" ]] || missing+=(ALIYUN_ACR_USERNAME)
          [[ -n "$ALIYUN_ACR_PASSWORD" ]] || missing+=(ALIYUN_ACR_PASSWORD)
          [[ -n "$ALIYUN_ACR_IMAGE_NAME" ]] || missing+=(ALIYUN_ACR_IMAGE_NAME)

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_ACR_REGISTRY }}
          username: ${{ env.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to both registries
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:latest
            ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.ALIYUN_ACR_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.ALIYUN_ACR_IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # 阿里云 ACR 个人版不支持 buildx 默认的 provenance 附件清单（oci.empty.v1）
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to aliyun
    needs: build-and-push
    runs-on: [self-hosted, aliyun]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-${{ github.repository }}-aliyun
      cancel-in-progress: false
    env:
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
      # twitterapi.io：流式回补与规则管理使用
      TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
      # 可选：X 走 syndication 接口时的代理，如 http://host.docker.internal:7890
      TWITTER_PROXY: ${{ secrets.TWITTER_PROXY }}
      # 可选：Reddit 被墙时走服务器本地代理，如 http://host.docker.internal:7890
      REDDIT_PROXY: ${{ secrets.REDDIT_PROXY }}
      # AI 翻译与总结（OpenAI 兼容接口），不配则只推原文
      AI_API_BASE: ${{ secrets.AI_API_BASE }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_MODEL: ${{ secrets.AI_MODEL }}

    steps:
      - name: Deploy with GHCR primary and Aliyun ACR fallback
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [[ -n "$FEISHU_WEBHOOK" ]] || missing+=(FEISHU_WEBHOOK)

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT

          printf '%s' "${{ github.token }}" |
            docker login "$GHCR_REGISTRY" -u "${{ github.actor }}" --password-stdin
          printf '%s' "${{ secrets.ALIYUN_ACR_PASSWORD }}" |
            docker login "$ALIYUN_ACR_REGISTRY" -u "$ALIYUN_ACR_USERNAME" --password-stdin

          GHCR_REPOSITORY="$GHCR_REGISTRY/$GHCR_IMAGE_NAME"
          ACR_REPOSITORY="$ALIYUN_ACR_REGISTRY/$ALIYUN_ACR_IMAGE_NAME"

          # GHCR 从国内服务器拉取可能长时间挂起，限时后回退 ACR
          if timeout --kill-after=20 120 docker pull "$GHCR_REPOSITORY:$IMAGE_TAG"; then
            IMAGE_REPOSITORY="$GHCR_REPOSITORY"
          elif timeout --kill-after=20 300 docker pull "$ACR_REPOSITORY:$IMAGE_TAG"; then
            echo "GHCR pull failed; using Aliyun ACR fallback."
            IMAGE_REPOSITORY="$ACR_REPOSITORY"
          else
            echo "Unable to pull image $IMAGE_TAG from GHCR or Aliyun ACR." >&2
            exit 1
          fi

          # Runner 非交互环境下 HOME 可能未定义（set -u 会报错），从 passwd 派生
          USER_HOME="$(getent passwd "$(id -un)" | cut -d: -f6)"
          DEPLOY_DIR="$USER_HOME/deployments/rss"
          mkdir -p "$DEPLOY_DIR/data"
          cd "$DEPLOY_DIR"

          cat > compose.yaml <<'COMPOSE_EOF'
          services:
            rss-push:
              image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}:${IMAGE_TAG:?IMAGE_TAG is required}
              container_name: rss-push
              restart: unless-stopped
              logging:
                driver: json-file
                options:
                  max-size: "10m"
                  max-file: "3"
              extra_hosts:
                - "host.docker.internal:host-gateway"
              environment:
                TZ: Asia/Shanghai
                # 服务器只负责 X 源；Reddit 由 Actions 直连拉取（见 reddit.yml）
                RSS_SOURCES: twitter
                # twitterapi.io 流式客户端：规则管理
                TWITTER_API_KEY: ${TWITTER_API_KEY:-}
                # 启动回补会按账号各花约 300 credits；默认关闭，接受重启窗口期可能漏推
                BACKFILL_ON_START: "0"
                # syndication 备用通道的代理（当前主通道为流式，不依赖代理）
                TWITTER_PROXY: ${TWITTER_PROXY:-http://host.docker.internal:7890}
                FEISHU_WEBHOOK: ${FEISHU_WEBHOOK:?FEISHU_WEBHOOK is required}
                FEISHU_SECRET: ${FEISHU_SECRET:-}
                REDDIT_PROXY: ${REDDIT_PROXY:-}
                AI_API_BASE: ${AI_API_BASE:-}
                AI_API_KEY: ${AI_API_KEY:-}
                AI_MODEL: ${AI_MODEL:-}
                RSS_DATA_DIR: /data
              volumes:
                - ./data:/data
          COMPOSE_EOF

          export IMAGE_REPOSITORY IMAGE_TAG FEISHU_WEBHOOK FEISHU_SECRET

          docker compose --project-name rss up -d --wait --wait-timeout 60
          docker compose ps

          cleanup_repository_images() {
            local repository="$1"
            local current_ref="$2"
            local stale_refs=()

            mapfile -t stale_refs < <(
              docker image ls "$repository" --format '{{.Repository}}:{{.Tag}}' |
                grep -Fvx "$current_ref" |
                grep -v ':<none>$' |
                sort -u || true
            )

            if (( ${#stale_refs[@]} > 0 )); then
              printf 'Removing old project images from %s:\n' "$repository"
              printf '  %s\n' "${stale_refs[@]}"
              docker image rm -f "${stale_refs[@]}"
            fi
          }

          # 只保留当前运行的 SHA 镜像，避免磁盘膨胀；标签过滤限定本项目的镜像。
          cleanup_repository_images "$GHCR_REPOSITORY" "$IMAGE_REPOSITORY:$IMAGE_TAG"
          cleanup_repository_images "$ACR_REPOSITORY" "$IMAGE_REPOSITORY:$IMAGE_TAG"
          docker image prune -f \
            --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}"

          echo "Deployment completed: $IMAGE_REPOSITORY:$IMAGE_TAG"

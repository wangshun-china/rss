name: net-test

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Reddit 可达性探测
        run: |
          echo "--- anonymous RSS ---"
          curl -s -o /tmp/a.xml -w "rss=%{http_code} size=%{size_download}\n" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) rss-bot/0.1" \
            "https://www.reddit.com/r/rust/new/.rss?limit=3"
          head -c 200 /tmp/a.xml; echo
          echo "--- old.reddit RSS ---"
          curl -s -o /dev/null -w "old=%{http_code}\n" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            "https://old.reddit.com/r/rust/new/.rss?limit=3"
          echo "--- oauth endpoint ---"
          curl -s -o /dev/null -w "oauth=%{http_code}\n" \
            "https://www.reddit.com/api/v1/access_token" -X POST

# 趋势日报：GitHub Trending + Hugging Face 模型雷达，每天上午 9 点（北京时间）
# 推送一次。两个榜单均不去重（仓库/模型连续上榜如实重复推送），limit 控制在
# 单卡容量内一次推完。去重状态与 reddit.yml 共用 state-reddit.json，
# 并发组与其串行，避免 git push 冲突。

name: trend-daily

on:
  schedule:
    - cron: "0 1 * * *" # UTC 01:00 = 北京时间 09:00
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rss-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 拉取趋势榜并推送飞书
        env:
          RSS_SOURCES: trending,radar
          RSS_STATE_FILE: state-reddit.json
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python main.py

      - name: 失败时发飞书告警
        if: failure()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          python - <<'EOF'
          import os
          from feishu import build_card, send

          webhook = os.environ.get("FEISHU_WEBHOOK")
          if webhook:
              send(webhook, os.environ.get("FEISHU_SECRET") or None,
                   build_card("⚠️ 趋势日报推送失败", "red",
                              ["GitHub Trending / 模型雷达运行失败，"
                               "请到 Actions 页查看日志。"]))
          EOF

      - name: 回写去重状态
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin master
          git add state-reddit.json
          git diff --cached --quiet || git commit -m "chore: 更新趋势去重状态 [skip ci]"
          git push

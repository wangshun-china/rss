# 一次性清理任务：移除服务器上的 rss 容器、镜像与部署目录。
# X 订阅已退役，服务器不再承担任何角色；跑完本 workflow 后即删除本文件。

name: Teardown rss server deploy

on:
  workflow_dispatch: {}

jobs:
  teardown:
    runs-on: [self-hosted, aliyun]
    timeout-minutes: 10
    steps:
      - name: Stop rss container and remove images
        shell: bash
        run: |
          set -euo pipefail
          USER_HOME="$(getent passwd "$(id -un)" | cut -d: -f6)"
          DEPLOY_DIR="$USER_HOME/deployments/rss"

          if [ -d "$DEPLOY_DIR" ]; then
            cd "$DEPLOY_DIR"
            docker compose --project-name rss down --rmi all --volumes --remove-orphans || true
            cd /
            rm -rf "$DEPLOY_DIR"
            echo "removed $DEPLOY_DIR"
          else
            echo "$DEPLOY_DIR not found; nothing to stop"
          fi

          # 兜底：清理残留项目镜像（compose down --rmi all 只覆盖部分层）
          docker image ls --format '{{.Repository}}:{{.Tag}}' \
            | grep -E '(ghcr\.io/wangshun-china/rss|wangshun_build/rss):' \
            | xargs -r docker image rm -f || true
          docker image prune -f \
            --filter "label=org.opencontainers.image.source=https://github.com/wangshun-china/rss" || true

          echo "---- 剩余 rss 相关镜像（应为空）----"
          docker image ls | grep -E 'rss' || echo "(none)"
